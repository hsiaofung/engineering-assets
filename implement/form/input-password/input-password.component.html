<ng-container [formGroup]="form">
  <!--
    The status class goes on the wrapper, not on the input. With a suffix present ng-zorro turns
    this host into `ant-input-affix-wrapper`, which is what carries the border — the input inside
    it has none — so an `error` class on the input styles an edge that is not drawn.
  -->
  <nz-input-wrapper [class]="dsStatus()">
    <input
      nz-input
      formControlName="value"
      [type]="inputType()"
      [maxlength]="maxlength()"
      [placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      (blur)="handleBlur()"
    />
    <span nzInputSuffix>
      <!--
        ng-zorro's own `nz-input-password` toggle renders as `<span role="button" tabindex="-1">`,
        which Tab cannot reach — so the visibility control stays hand-rolled, as a real button.
      -->
      <button
        type="button"
        class="visibility-toggle"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="showPassword()"
        [disabled]="form.disabled"
        (click)="togglePasswordVisibility()"
      >
        <svg-icon src="assets/design-system/icons/eye.svg" [svgStyle]="eyeIconStyle()" style="display: flex"></svg-icon>
      </button>
    </span>
  </nz-input-wrapper>
</ng-container>
